[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-radar-mcp"
version = "1.0.0"
description = "MCP server for discovering, ranking and comparing GitHub repositories using the GitHub API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Javier Morrón" }
]
keywords = ["mcp", "github", "ai-agents", "open-source", "python", "repository-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp[cli]>=1.2.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/javiermorron/repo-radar-mcp"
Repository = "https://github.com/javiermorron/repo-radar-mcp"
LinkedIn = "https://www.linkedin.com/in/javiermorron"

[tool.setuptools.packages.find]
where = ["src"]
